services:
  bot:
    build: .
    container_name: devcoder-privat-bot
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - BOT_NAME=${BOT_NAME:-DevCoderPrivatBot}
      - BUG_CHANNEL_ID=${BUG_CHANNEL_ID}
      - TICKET_CATEGORY_ID=${TICKET_CATEGORY_ID}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:6062}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - DEFAULT_TARGET_LANGUAGE=${DEFAULT_TARGET_LANGUAGE:-en}
    ports:
      - "6062:6062"
    volumes:
      - ./logs:/app/logs
      - ./transcripts:/app/transcripts
